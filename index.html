<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Voice Assistant Trigger</title>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow-models/speech-commands@0.4.0/dist/speech-commands.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; background: #121212; color: white; padding-top: 40px; }
        button { padding: 12px 25px; font-size: 18px; border-radius: 8px; border: none; background: #0088ff; color: white; cursor: pointer; margin-top: 15px; }
        #label-container { margin-top: 25px; font-size: 22px; line-height: 2; }
        
        /* 🚨 Pop-up Modal Styling */
        #alert-modal {
            display: none;
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 80%;
            max-width: 450px;
            background: #ff1744;
            color: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0px 0px 30px rgba(255, 23, 68, 0.8);
            z-index: 1000;
            animation: pulse 1s infinite alternate;
        }
        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); }
            100% { transform: translate(-50%, -50%) scale(1.05); }
        }
        #overlay {
            display: none;
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.8);
            z-index: 999;
        }
        .stop-btn { background: #ffffff; color: #d50000; font-weight: bold; }
    </style>
</head>
<body>

    <h1>🎙️ AI Assistive Voice Trigger</h1>
    <p>Voice Commands: <strong>Help | Water | Medicine</strong></p>
    <button type="button" onclick="init()">🎤 Start Listening</button>
    
    <div id="label-container"></div>

    <!-- 🚨 Emergency Pop-Up Banner -->
    <div id="overlay"></div>
    <div id="alert-modal">
        <h1 style="margin: 0; font-size: 32px;">🚨 EMERGENCY ALERT!</h1>
        <p style="font-size: 20px; margin-top: 15px;">User requested: <strong>HELP!</strong></p>
        <button class="stop-btn" onclick="dismissAlert()">STOP ALARM & DISMISS</button>
    </div>

    <script type="text/javascript">
        // 🔗 Replace this with your Teachable Machine model URL from Teachable Machine
        const URL = "https://teachablemachine.withgoogle.com/models/YOUR_MODEL_ID/";

        let audioCtx = null;
        let sirenInterval = null;
        let isAlertActive = false;

        // 🔊 Synthesize Emergency Siren using Web Audio API
        function startSiren() {
            if (sirenInterval) return;
            audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            let highPitch = false;

            sirenInterval = setInterval(() => {
                if (!audioCtx) return;
                let osc = audioCtx.createOscillator();
                let gain = audioCtx.createGain();
                osc.type = 'sine';
                osc.frequency.value = highPitch ? 950 : 650; // Siren high/low pitch toggle
                gain.gain.value = 0.3;
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.18);
                highPitch = !highPitch;
            }, 200);
        }

        function stopSiren() {
            if (sirenInterval) {
                clearInterval(sirenInterval);
                sirenInterval = null;
            }
            if (audioCtx) {
                audioCtx.close();
                audioCtx = null;
            }
        }

        function triggerHelpAlert() {
            if (isAlertActive) return;
            isAlertActive = true;
            document.getElementById('overlay').style.display = 'block';
            document.getElementById('alert-modal').style.display = 'block';
            startSiren();
        }

        function dismissAlert() {
            isAlertActive = false;
            document.getElementById('overlay').style.display = 'none';
            document.getElementById('alert-modal').style.display = 'none';
            stopSiren();
        }

        async function createModel() {
            const checkpointURL = URL + "model.json";
            const metadataURL = URL + "metadata.json";
            const recognizer = speechCommands.create("BROWSER_FFT", undefined, checkpointURL, metadataURL);
            await recognizer.ensureModelLoaded();
            return recognizer;
        }

        async function init() {
            const recognizer = await createModel();
            const classLabels = recognizer.wordLabels();
            const labelContainer = document.getElementById("label-container");
            labelContainer.innerHTML = "";
            
            for (let i = 0; i < classLabels.length; i++) {
                labelContainer.appendChild(document.createElement("div"));
            }

            recognizer.listen(result => {
                const scores = result.scores;
                for (let i = 0; i < classLabels.length; i++) {
                    const label = classLabels[i];
                    const score = (result.scores[i] * 100).toFixed(1);
                    labelContainer.childNodes[i].innerHTML = `${label}: <strong>${score}%</strong>`;

                    // 🚨 Trigger Alarm & Popup if "Help" confidence is > 85%
                    if (label.toLowerCase().includes("help") && result.scores[i] > 0.85) {
                        triggerHelpAlert();
                    }
                }
            }, {
                includeSpectrogram: true,
                probabilityThreshold: 0.75,
                invokeCallbackOnNoiseAndUnknown: true,
                overlapFactor: 0.50
            });
        }
    </script>
</body>
</html>
